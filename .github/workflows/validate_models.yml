name: Validate Models (walk-forward, no DB writes)

# ─────────────────────────────────────────────────────────────────────────────
# VALIDAZIONE walk-forward in cloud, SOLA LETTURA (nessuna scrittura su DB/storage).
# Confronta config VECCHIA (3 stagioni) vs NUOVA (storico pieno + regolarizzazione)
# su poche leghe di test, per certificare il guadagno PRIMA del retrain di massa.
#
# Gentile sul DB (stessa logica di retrain_models.yml):
#   - pre-flight DB probe: se l'istanza Nano e' lenta (>12s) salta il run;
#   - legge UNA lega alla volta (lo script processa i league_id in sequenza);
#   - nessuna query bulk pesante, nessuna scrittura.
# Default: leghe 39 (Premier League) + 140 (La Liga), Fascia A con stat+quote.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "league_id di test (csv). Default: 39 (Premier League), 140 (La Liga)."
        default: "39,140"
        required: true
      test_seasons:
        description: "Numero di stagioni finali su cui fare walk-forward."
        default: "3"
        required: true

concurrency:
  group: validate-models
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-train.txt

      - name: Install pinned training stack (serving parity)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Pre-flight DB probe (non stressare un DB gia' lento)
        id: probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os, time, urllib.request
          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          req = urllib.request.Request(
              url + "/rest/v1/ai_model_registry?select=id&limit=1",
              headers={"apikey": key, "Authorization": "Bearer " + key},
          )
          slow = "false"
          t = time.time()
          try:
              urllib.request.urlopen(req, timeout=25).read()
              dt = time.time() - t
              print(f"[PROBE] DB ok in {dt:.1f}s")
              if dt > 12:
                  slow = "true"
                  print("[PROBE] DB lento (>12s): salto questo run.")
          except Exception as e:
              slow = "true"
              print(f"[PROBE] DB non reattivo ({e!r}): salto.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"slow={slow}\n")
          PY

      - name: Run walk-forward validation
        if: steps.probe.outputs.slow != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          LEAGUES_INPUT: ${{ inputs.leagues || '39,140' }}
          TEST_SEASONS: ${{ inputs.test_seasons || '3' }}
        run: |
          python validate_walkforward.py --leagues "$LEAGUES_INPUT" --test-seasons "$TEST_SEASONS" | tee validate_log.txt

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-log
          path: validate_log.txt
          if-no-files-found: ignore
          retention-days: 30
