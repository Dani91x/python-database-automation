name: Daily Yesterday Backfill

on:
  # 09/10/2026 (cantiere orologio notturno): NESSUN cron GitHub. Il cron di GitHub
  # partiva con 5-6 h di ritardo mediano (07:00-07:30 UTC, app accesa) e trascinava
  # 4-5 action insieme sul DB (crash di Postgres del 09/10 mattina). Ora questo
  # workflow lo lancia l'OROLOGIO NOSTRO: pg_cron sul DB alle 00:12 UTC (02:12 ora
  # italiana, app spenta), UNA volta al giorno (guardia public.lanci_action, vedi
  # migrations/orologio_action_notturne_2026-10-09.sql), con catena=true.
  # E' il PRIMO anello della catena. Un lancio a mano con catena=true rifa' TUTTA la
  # catena a valle; con catena=false (default) gira solo il backfill.
  # Catena notturna IN FILA (un solo lavoro per volta sul DB), ordine del 09/10/2026:
  # 1 Daily Yesterday Backfill -> 2 Retrain ML -> 3 ML Post-Calibration ->
  # 4 Today Predictions Backfill -> 5 Hazard Atlas -> 6 Leagues Mapping ->
  # 7 Seasons Catchup -> 8 Predictions Results Backfill -> 9 Weekly Poisson (solo lunedi').
  # Il primo anello lo lancia l'orologio pg_cron (00:12 UTC); ogni anello lancia il
  # successivo con il job passa-testimone (in fondo al file). Nessun cron GitHub.
  workflow_dispatch:
    inputs:
      catena:
        description: "Catena notturna: 'true' = finito questo, lancia il prossimo anello (lo mettono l'orologio pg_cron e l'anello precedente). A mano lascia 'false': gira solo questo workflow."
        type: choice
        options: ["false", "true"]
        default: "false"

# Mai due backfill sovrapposti (orologio + lancio a mano): il secondo attende.
concurrency:
  group: daily-yesterday-backfill
  cancel-in-progress: false

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python daily_yesterday_backfill.py

  # 25/09/2026: il job `hazard-atlas` (atlante hazard, montato dal 6070623) e'
  # stato SPOSTATO nel workflow suo `hazard_atlas.yml`, agganciato alla fine di
  # questo. Qui dentro un suo fallimento rendeva rossa l'intera run e faceva
  # SALTARE il retrain (che guarda la conclusion di questa run) anche con il
  # backfill verde. Ora l'esito di questa run = esito del solo backfill.

  # STAFFETTA (09/10/2026, cantiere orologio notturno): finito il lavoro di questa run,
  # lancia il PROSSIMO anello della catena notturna (workflow_dispatch con GITHUB_TOKEN,
  # .github/scripts/passa_testimone.sh). Regola: passa il testimone se la run NON e' stata
  # annullata (!cancelled(): anche dopo un fallimento la catena prosegue, una cancellazione
  # manuale la ferma) e SOLO se questa run fa parte della catena (input catena=true: lo
  # mettono l'orologio pg_cron e l'anello precedente; un lancio a mano parte con
  # catena=false e NON trascina gli anelli a valle).
  # Al Retrain passa monte_ok=true SOLO se il backfill e' andato a buon fine: il
  # Retrain conserva la regola di prima (allena solo dopo un Daily success); se il
  # backfill fallisce il Retrain salta il training ma passa comunque il testimone.
  passa-testimone:
    needs: [run-backfill]
    if: ${{ !cancelled() && inputs.catena == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: write      # gh workflow run del prossimo anello
      contents: read
    steps:
      - name: Checkout (solo lo script della staffetta)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Passa il testimone a retrain_models.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROSSIMO_ANELLO: retrain_models.yml
          MONTE_OK: ${{ needs.run-backfill.result == 'success' }}
        run: bash .github/scripts/passa_testimone.sh "$PROSSIMO_ANELLO" monte_ok="$MONTE_OK"
