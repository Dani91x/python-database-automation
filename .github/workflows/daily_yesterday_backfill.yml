name: Daily Yesterday Backfill

on:
  schedule:
    - cron: '12 1 * * *'   # 01:12 UTC (minuto off-peak: parte vicino all'orario, non in fila a :00)
  workflow_dispatch:

# Mai due backfill sovrapposti (pianificato + lancio a mano): il secondo attende.
concurrency:
  group: daily-yesterday-backfill
  cancel-in-progress: false

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python daily_yesterday_backfill.py

  # 25/09/2026: il job `hazard-atlas` (atlante hazard, montato dal 6070623) e'
  # stato SPOSTATO nel workflow suo `hazard_atlas.yml`, agganciato alla fine di
  # questo. Qui dentro un suo fallimento rendeva rossa l'intera run e faceva
  # SALTARE il retrain (che guarda la conclusion di questa run) anche con il
  # backfill verde. Ora l'esito di questa run = esito del solo backfill.
