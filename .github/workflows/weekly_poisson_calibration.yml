name: Weekly Poisson Calibration

on:
  # 09/10/2026: tolto il cron (27 3 * * 1). NONO e ULTIMO anello della catena notturna:
  # lo lancia Predictions Results (passa-testimone) OGNI notte, ma la calibrazione gira
  # SOLO il lunedi' (giorno UTC, job giorno qui sotto); gli altri giorni il job calibrate
  # e' skipped, dichiarato nel riepilogo. Un lancio a mano (catena=false) gira sempre.
  # Ultimo anello: nessun passa-testimone.
  # Catena notturna IN FILA (un solo lavoro per volta sul DB), ordine del 09/10/2026:
  # 1 Daily Yesterday Backfill -> 2 Retrain ML -> 3 ML Post-Calibration ->
  # 4 Today Predictions Backfill -> 5 Hazard Atlas -> 6 Leagues Mapping ->
  # 7 Seasons Catchup -> 8 Predictions Results Backfill -> 9 Weekly Poisson (solo lunedi').
  # Il primo anello lo lancia l'orologio pg_cron (00:12 UTC); ogni anello lancia il
  # successivo con il job passa-testimone (in fondo al file). Nessun cron GitHub.
  workflow_dispatch:       # lancio manuale dal tab Actions
    inputs:
      catena:
        description: "Catena notturna: 'true' = finito questo, lancia il prossimo anello (lo mettono l'orologio pg_cron e l'anello precedente). A mano lascia 'false': gira solo questo workflow."
        type: choice
        options: ["false", "true"]
        default: "false"

# 09/10/2026: gruppo come gli altri anelli (mai due calibrazioni sovrapposte, nessuna
# cancellata: la seconda attende).
concurrency:
  group: weekly-poisson-calibration
  cancel-in-progress: false

jobs:
  # Il lunedi' si decide qui (data UTC del runner): l'espressione if di GitHub non
  # conosce il giorno della settimana.
  giorno:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      lunedi: ${{ steps.g.outputs.lunedi }}
    steps:
      - name: Oggi e' lunedi' (UTC)?
        id: g
        run: |
          D="$(date -u +%u)"
          if [ "$D" = "1" ]; then
            echo "lunedi=true" >> "$GITHUB_OUTPUT"
            echo "Oggi (UTC) e' lunedi': calibrazione settimanale."
          else
            echo "lunedi=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Oggi (UTC) non e' lunedi' (giorno $D): calibrazione settimanale SALTATA nella catena (skipped dichiarato)."
            echo "Calibrazione settimanale SALTATA: oggi (UTC) non e' lunedi' (giorno $D). Gira solo il lunedi' nella catena notturna." >> "$GITHUB_STEP_SUMMARY"
          fi

  calibrate:
    needs: giorno
    # Nella catena solo il lunedi'; a mano (catena=false) sempre.
    if: ${{ inputs.catena != 'true' || needs.giorno.outputs.lunedi == 'true' }}
    runs-on: ubuntu-latest
    # 09/10/2026: tetto esplicito (prima il default di GitHub, 360 min): ultime 4 riuscite mediana 18 min, max 22
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Step 1 — Genera dynamic_cal.json (calibrazione per-lega)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python generate_dynamic_cal.py

      - name: Step 2 — Aggiorna CALIBRATION_TABLE in money_management.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python update_poisson_calibration.py --apply

      - name: Step 3 — Rigenera dc_rho_by_league.json (ρ Dixon-Coles per-lega)
        id: rho
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONIOENCODING: utf-8
        # Non bloccare la calibrazione settimanale se la stima ρ fallisce:
        # il motore degrada al ρ globale -0.13 se il file manca/è invariato.
        continue-on-error: true
        run: python generate_dc_rho.py

      - name: Commit e push calibrazioni aggiornate
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dynamic_cal.json Betfair/money_management.py dc_rho_by_league.json
          # Committa solo se ci sono cambiamenti reali
          if git diff --cached --quiet; then
            echo "Nessun cambiamento nei file di calibrazione, skip commit."
          else
            FIXTURES=$(python -c "import json; d=json.load(open('dynamic_cal.json')); print(d.get('total_fixtures','?'))")
            LEAGUES=$(python -c "import json; d=json.load(open('dynamic_cal.json')); print(d.get('leagues_covered','?'))")
            git commit -m "chore(calibration): aggiornamento settimanale Poisson

            - dynamic_cal.json: ${FIXTURES} fixture, ${LEAGUES} leghe calibrate
            - CALIBRATION_TABLE: aggiornata in money_management.py
            - Filtro: solo modello poisson_xg_hybrid_dc
            - Cap correction factor: [0.2, 3.0]"
            # Push resiliente: un altro workflow schedulato può aver pushato su master
            # mentre questo job girava (~9 min). Rebase + retry invece di fallire.
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push riuscito al tentativo $i."
                break
              fi
              if [ "$i" -eq 5 ]; then
                echo "Push fallito dopo 5 tentativi." >&2
                exit 1
              fi
              echo "Push rifiutato (probabile race con altro workflow), rebase e retry ($i)..."
              # --autostash: gli step di calibrazione possono lasciare modifiche
              # non-staged nel working tree (file extra rigenerati). Senza autostash
              # il rebase aborta con "cannot pull with rebase: You have unstaged changes".
              git pull --rebase --autostash origin master
            done
          fi

      # GATE ERRORI NASCOSTI (21/09/2026): lo Step 3 e' continue-on-error (il motore
      # degrada al rho globale se il file manca), ma in passato falliva per timeout DB
      # quasi ogni settimana con il run VERDE. Gira sempre, DOPO il commit delle
      # calibrazioni: se lo Step 3 e' fallito il run diventa ROSSO e l'errore e' visibile.
      - name: Gate errori nascosti (rosso se lo Step 3 e' fallito)
        if: always()
        env:
          ESITO_RHO: ${{ steps.rho.outcome }}
        run: |
          echo "Esito Step 3 (rho per lega): $ESITO_RHO"
          if [ "$ESITO_RHO" = "failure" ]; then
            echo "::error::Step 3 fallito: dc_rho_by_league.json NON rigenerato (il motore usa il file precedente / rho globale)."
            exit 1
          fi
