name: Predictions Results Backfill

on:
  schedule:
    # Esegue ogni giorno alle 03:23 UTC (minuto off-peak: parte vicino all'orario, non in fila a :00)
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Data YYYY-MM-DD da rivalutare (vuoto = ieri UTC, comportamento di default)'
        required: false
        type: string
        default: ''

concurrency:
  group: predictions-results-backfill
  cancel-in-progress: false

jobs:
  run-results-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Calcola la finestra incrementale per gli step additivi qui sotto (--days).
      # Con input 'date' vuoto: GIORNI_FINESTRA=4, IDENTICO al comportamento di oggi.
      # Con 'date' valorizzata (backfill nel passato): gli step additivi ancorano la
      # loro finestra a now() UTC (non alla data target, vedi build_analytics_signals.py
      # riga 325, merge_engine_signals.py riga 234, enrich_analytics_snapshots.py riga 308,
      # refresh_analytics_bets.py riga 162), quindi allarghiamo la finestra a
      # (oggi - data target) + 1 giorni, con un minimo di 4 (mai piu' stretta di oggi).
      - name: Calcola finestra incrementale (GIORNI_FINESTRA)
        env:
          BACKFILL_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -z "$BACKFILL_DATE" ]; then
            echo "GIORNI_FINESTRA=4" >> "$GITHUB_ENV"
          else
            TARGET_EPOCH=$(date -u -d "$BACKFILL_DATE" +%s 2>/dev/null)
            if [ -z "$TARGET_EPOCH" ]; then
              echo "::error::Data non valida per l'input 'date': '$BACKFILL_DATE' (atteso formato YYYY-MM-DD)"
              exit 1
            fi
            OGGI_EPOCH=$(date -u +%s)
            DIFF_GIORNI=$(( (OGGI_EPOCH - TARGET_EPOCH) / 86400 + 1 ))
            if [ "$DIFF_GIORNI" -lt 4 ]; then
              DIFF_GIORNI=4
            fi
            echo "GIORNI_FINESTRA=$DIFF_GIORNI" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        id: risultati
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          BACKFILL_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$BACKFILL_DATE" ]; then
            python -m Prediction.predictions_results_backfill --date "$BACKFILL_DATE"
          else
            python -m Prediction.predictions_results_backfill
          fi

      # ADDITIVO E NON-FATALE: dopo che i risultati sono settlati, aggiorna la
      # tabella analytics_signals (centro di controllo) per le partite recenti —
      # nuove predizioni Poisson/ML/TacticAI + quelle appena giocate (settlate a
      # 90'). Idempotente (upsert). Una finestra di 4 giorni copre sia le predizioni
      # in arrivo sia le partite appena concluse. Un errore qui NON deve far fallire
      # la pipeline risultati (critica).
      - name: Aggiorna analytics_signals (incrementale)
        id: signals
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python build_analytics_signals.py --days "$GIORNI_FINESTRA"

      # Sincronizza il firehose engine_signals → layer decisioni analytics_decisions
      # (+ previsioni in analytics_signals): porta piazzate/scartate/no_signal +
      # valore/motivo nel centro di controllo. Additivo, non-fatale, idempotente.
      - name: Sync decisioni (engine_signals → analytics_decisions)
        id: merge
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python merge_engine_signals.py --days "$GIORNI_FINESTRA"

      # ADDITIVO E NON-FATALE: arricchisce freq/ritardi (snapshot contesto mercato)
      # SOLO sulle partite recenti presenti in analytics_signals (modo INCREMENTALE).
      # Le partite del giorno non ancora settlate ricevono lo STATO CORRENTE del
      # mercato (valore "in entrata", calcolato sulla storia settlata precedente);
      # quelle appena giocate ricevono il loro snapshot point-in-time. Scrittura
      # BULK (staging + 1 UPDATE/lega) → veloce e poco stressante. NON lancia mai
      # l'enrich STORICO completo (46k): quello è on-demand dall'utente. Un errore
      # qui NON deve far fallire la pipeline risultati.
      - name: Enrich freq/ritardi (incrementale, BULK)
        id: enrich
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python enrich_analytics_snapshots.py --days "$GIORNI_FINESTRA"

      # ADDITIVO E NON-FATALE: rinfresca la tabella materializzata analytics_bets
      # (motore strategie) per i giorni recenti — incrementale per intervallo di date,
      # veloce e scalabile. Va DOPO build/merge/enrich così le scommesse riflettono
      # previsioni, decisioni+quote e snapshot aggiornati. Un errore qui NON blocca.
      - name: Refresh analytics_bets (motore strategie, incrementale)
        id: bets
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python refresh_analytics_bets.py --days "$((GIORNI_FINESTRA + 1))"

      # ADDITIVO E NON-FATALE: rinfresca la PAGELLA (direction_pagella) DOPO il refresh
      # di analytics_bets — da cui dipende via la vista bet_features. Ricalcola l'hit-rate
      # storico dei motori includendo le partite appena chiuse, cosi' l'affidabilita' del
      # cruscotto Direzione resta sempre fresca. Upsert sicuro (mai una finestra vuota).
      # Un errore qui NON deve far fallire la pipeline risultati: la pagella resta quella
      # del giorno precedente.
      - name: Refresh pagella Direzione
        id: pagella
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python build_direzione.py

      # GATE ERRORI NASCOSTI (21/09/2026). Gli step qui sopra sono continue-on-error
      # (additivi: uno che fallisce non deve impedire agli altri di girare), ma in
      # passato fallivano ogni giorno senza che il run diventasse rosso (dati di analisi
      # e pagella vecchi in silenzio). Questo step gira sempre e, se un qualsiasi step
      # e' fallito, rende il run ROSSO: cosi' verde = nessun dato perso. Non cambia
      # cosa viene eseguito ne' i dati scritti, solo la visibilita' dell'esito.
      - name: Gate errori nascosti (rosso se uno step non-fatale e' fallito)
        if: always()
        env:
          ESITI: "risultati=${{ steps.risultati.outcome }} signals=${{ steps.signals.outcome }} merge=${{ steps.merge.outcome }} enrich=${{ steps.enrich.outcome }} bets=${{ steps.bets.outcome }} pagella=${{ steps.pagella.outcome }}"
        run: |
          echo "Esiti step: $ESITI"
          ko=0
          for kv in $ESITI; do
            v="${kv#*=}"
            # Solo "success" e' un esito buono: un valore vuoto (id rinominato o tolto),
            # sconosciuto, skipped, cancelled o failure rende il run ROSSO.
            if [ "$v" != "success" ]; then
              echo "::error::Step '${kv%%=*}' con esito '${v:-<vuoto>}': i dati corrispondenti NON sono stati aggiornati (o l'esito e' ignoto)."
              ko=1
            fi
          done
          exit $ko
