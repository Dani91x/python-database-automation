name: Retrain ML Models (cloud, all leagues)

# ─────────────────────────────────────────────────────────────────────────────
# CAMPAGNA AUTO-COMPLETANTE, GENTILE SUL DB (riscritta 2026-06-13)
#
# Obiettivo: finire di addestrare TUTTE le leghe (mancanti + vecchie/leaked-era)
# senza mai stressare l'istanza Supabase (tier Nano, I/O del disco basso) e senza
# mai avvicinarsi al timeout GitHub di 6h.
#
# Come funziona:
#   1) Il PLANNER (training_planner.py) sceglie in 2 sole query bulk le leghe da
#      fare (MISSING + STALE<cutoff): niente piu' una-query-per-lega.
#   2) Si addestra UNA lega alla volta (parallel_leagues=1, 1 shost) con gli
#      indici di sql/perf_indexes.sql attivi => letture leggere, I/O sotto soglia.
#   3) TIME-BUDGET: dopo ~150 min il run smette di prendere nuove leghe ed esce
#      pulito (le fatte sono gia' salvate nel registry). timeout-minutes=175 e'
#      una rete di sicurezza: il run NON puo' superare ~3h, mai vicino alle 6h.
#   4) Lo schedule (ogni 3h) fa ripartire il run: il planner esclude le leghe
#      gia' fresche => si riprende da dove si era fermato, fino a CONVERGENZA
#      (quando non resta nulla, i run diventano no-op di pochi secondi).
#      Cadenza 3h = run quasi back-to-back (run ~2,5h, concurrency serializza gli
#      overlap): chiude la campagna in poche ore. La pre-flight DB probe salta
#      comunque il run se l'istanza e' lenta (>12s) => valvola anti-saturazione.
#
# ⚠️ PREREQUISITO: lanciare sql/perf_indexes.sql nel SQL Editor PRIMA di
#    riabilitare lo schedule. Senza indici ogni training fa SEQ SCAN di `matches`
#    e ri-satura l'I/O. Il workflow parte disabilitato: riabilitare con
#    `gh workflow enable retrain_models.yml` quando gli indici sono in.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # ───────────────────────────────────────────────────────────────────────────
  # TRIGGER EVENT-DRIVEN (2026-06-19): la campagna di massa e' CONVERSA, si passa
  # alla MANUTENZIONE INCREMENTALE. I risultati settlati entrano nel DB UNA volta
  # al giorno (workflow "Daily Yesterday Backfill", cron 0 1 * * *), quindi non ha
  # senso pollare "ogni 4h a caso": tra un backfill e l'altro non c'e' nulla di
  # nuovo da addestrare.
  #
  # Percio' il retrain si aggancia alla FINE di quel backfill (workflow_run): gira
  # UNA volta, il job `plan` esegue il planner e — se NESSUNA lega ha accumulato
  # >=1 giornata di partite nuove (soglia adattiva max(10, squadre/2) nella RPC
  # leagues_needing_retrain) — SALTA del tutto gli shard di training (has_work=false).
  # Cosi' gli allenamenti partono SOLO quando c'e' lavoro vero.
  #
  # workflow_dispatch resta per i run manuali (override leghe / campagne cutoff).
  workflow_run:
    workflows: ["Daily Yesterday Backfill"]
    types: [completed]
  # FALLBACK GIORNALIERO (gated): rete di sicurezza se l'evento workflow_run si
  # perde (raro ma capita su GitHub). NON e' polling "a caso": e' UN solo check al
  # giorno e, grazie al gate, se non c'e' lavoro skippa in ~30s senza accendere
  # shard. 08:19 UTC = dopo che il backfill (01:12) e' sicuramente finito, anche
  # con ritardi. Minuto off-peak per non finire in fila a :00.
  schedule:
    - cron: "19 8 * * *"
  workflow_dispatch:
    inputs:
      total_shards:
        description: "Job paralleli (shard) = runner separati, 1 lega ciascuno. Default 3 (regime incrementale: meno runner accesi = meno minuti fatturati a parita' di leghe allenate; l'auto-chain smaltisce comunque la coda). Alza a 5 per campagne di massa."
        default: "3"
        required: true
      use_planner:
        description: "Il planner sceglie le leghe (mancanti + stale<cutoff) in 2 query bulk."
        type: choice
        options: ["true", "false"]
        default: "true"
      leagues:
        description: "Override: solo queste leghe (csv, es. 135,39,140). Vuoto = decide il planner."
        default: ""
        required: false
      time_budget_min:
        description: "Stop NUOVE leghe dopo N minuti (4h=240). L'ultima lega in corso finisce, poi il run esce; il cron rilancia ~30 min dopo."
        default: "240"
        required: true
      parallel_leagues:
        description: "Leghe in parallelo per shard. Su Nano tieni 1."
        default: "1"
        required: true
      last_n_seasons:
        description: "Stagioni di training per lega. 20 = STORICO PIENO (max 17 stagioni nel DB): massima profondita' di dati, fix overfitting."
        default: "20"
        required: true
      chain_depth:
        description: "USO INTERNO (auto-chain): profondita' della catena di run. Lascia 0 per i run manuali. Il job rechain lo incrementa quando rilancia per smaltire le leghe rimaste oltre il time-budget."
        default: "0"
        required: false

# Mai due campagne sovrapposte: un run nuovo attende la fine di quello in corso.
concurrency:
  group: retrain-models
  cancel-in-progress: false

jobs:
  plan:
    # Su workflow_run parte SOLO se il backfill a monte e' andato a buon fine
    # (inutile ricontrollare se l'ingest dei risultati e' fallito). I run manuali
    # (workflow_dispatch) passano sempre.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      has_work: ${{ steps.gate.outputs.has_work }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-planner.txt

      - name: Install planner deps (leggere, niente training stack)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-planner.txt

      - name: Planner gate (allena solo se c'e' >=1 giornata di partite nuove)
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USE_PLANNER: ${{ inputs.use_planner || 'true' }}
          LEAGUES_INPUT: ${{ inputs.leagues || '' }}
          # 1 giornata = 10 partite (regola utente 2026-06-19). La RPC alza poi la
          # soglia per-lega a max(10, squadre/2): leghe grandi => piu' segnale.
          RETRAIN_INCREMENTAL_MIN_NEW: "10"
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import os
          leagues = os.environ.get("LEAGUES_INPUT", "").strip()
          use_planner = os.environ.get("USE_PLANNER", "true").lower() == "true"
          # Override manuale (leghe esplicite o planner OFF): rispetta l'intento
          # dell'utente, niente gate — si allena comunque.
          if not use_planner or leagues:
              print(f"[GATE] override manuale (leagues='{leagues}', use_planner={use_planner}): training forzato.")
              has_work = True
          else:
              from training_planner import select_leagues_to_train
              plan = select_leagues_to_train()
              n = len(plan["todo"])
              has_work = n > 0
              print(f"[GATE] mode={plan['mode']} | da_fare={n} "
                    f"(missing={len(plan['missing'])}, stale={len(plan['stale'])}, "
                    f"incremental={len(plan['incremental'])}) | "
                    f"gia_fresche={plan['fresh_count']} | universe={plan['universe']}")
              print(f"[GATE] prime 30 da fare: {plan['todo'][:30]}")
          verdict = "true" if has_work else "false"
          print(f"[GATE] has_work={verdict}"
                + ("" if has_work else "  => NESSUNA lega con >=1 giornata nuova: salto il training."))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_work={verdict}\n")
          PY

      - name: Genera matrice shard
        id: gen
        if: steps.gate.outputs.has_work == 'true'
        env:
          TOTAL_SHARDS: ${{ inputs.total_shards || '3' }}
        run: |
          SHARDS=$(python3 -c "import json, sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$TOTAL_SHARDS")
          echo "shards=${SHARDS}" >> "$GITHUB_OUTPUT"
          echo "Matrice shard: ${SHARDS}"

  train:
    needs: plan
    # GATE: gli shard di training partono SOLO se il planner ha trovato lavoro
    # (>=1 lega con >=1 giornata di partite nuove). Altrimenti il run finisce qui.
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    # Rete di sicurezza. Il time-budget interno (240 min = 4h) ferma le NUOVE
    # leghe; l'ultima in corso finisce. Con lo STORICO PIENO una lega grande e'
    # piu' lenta (fino a ~60-80 min), quindi il timeout hard sale a 330 (5h30):
    # ~90 min di margine per chiudere l'ultima lega senza uccidere lo shard.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: "train shard ${{ matrix.shard }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.13 = stessa major.minor del Python di serving sul PC locale.
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-train.txt

      - name: Install pinned training stack (serving parity)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      # ─── Cache Optuna persistente tra run ──────────────────────────────────
      # Il codice di training ha GIA' una cache iperparametri per-lega
      # (models_cache/league_*/optuna_params_*.json) con guardie di qualita':
      # ri-tuning forzato se cambia il tier o se il dataset varia oltre il 20%
      # (seriea_model_export.py:307-326). Sul runner effimero pero' la cartella
      # sparisce a fine job => ogni run ri-tunava da zero (15-30 trial x ~18
      # target x lega = il grosso dei minuti fatturati). Qui la ripristiniamo:
      # - restore-keys a prefisso: ogni shard riparte dall'ultima cache salvata
      #   (di qualunque shard: i file sono per-lega, un miss = solo un ri-tune).
      # - key unica per run+shard: si salva sempre una cache aggiornata che
      #   ACCUMULA i JSON ripristinati + quelli nuovi (unione crescente).
      # NB: cambia solo DOVE vengono letti i best_params (cache invece di
      # ri-tuning); la logica di validita' resta quella del codice.
      - name: Restore cache Optuna (iperparametri per-lega)
        uses: actions/cache@v4
        with:
          path: Ai Engine/models_cache/**/optuna_params_*.json
          key: optuna-params-${{ github.run_id }}-shard-${{ matrix.shard }}
          restore-keys: |
            optuna-params-

      - name: Pre-flight DB probe (non stressare un DB gia' lento)
        id: probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os, time, json, urllib.request
          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          req = urllib.request.Request(
              url + "/rest/v1/ai_model_registry?select=id&limit=1",
              headers={"apikey": key, "Authorization": "Bearer " + key},
          )
          slow = "false"
          t = time.time()
          try:
              urllib.request.urlopen(req, timeout=25).read()
              dt = time.time() - t
              print(f"[PROBE] DB ok in {dt:.1f}s")
              if dt > 12:
                  slow = "true"
                  print("[PROBE] DB lento (>12s): salto questo run per non stressarlo.")
          except Exception as e:
              slow = "true"
              print(f"[PROBE] DB non reattivo ({e!r}): salto questo run.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"slow={slow}\n")
          PY

      - name: Train shard (planner + time-budget)
        if: steps.probe.outputs.slow != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # GENTILEZZA SUL DB = solo PARALLEL_LEAGUES=1 (1 sola lega legge dal DB
          # per volta). RETRAIN_N_WORKERS invece e' parallelismo dei 18 target
          # DENTRO una lega, sui dati gia' scaricati UNA volta (build_training_dataset):
          # usa solo la CPU del runner (4 vCPU), ZERO carico DB extra. Quindi 4 =
          # training ~3-4x piu' veloce per lega a parita' di stress sul database.
          RETRAIN_N_WORKERS: "4"
          RETRAIN_PARALLEL_LEAGUES: "1"
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          # Inputs via env (mai interpolati nello script: anti shell-injection).
          # I fallback servono per i run da cron (inputs vuoti negli eventi schedule).
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ inputs.total_shards || '3' }}
          USE_PLANNER: ${{ inputs.use_planner || 'true' }}
          LEAGUES_INPUT: ${{ inputs.leagues || '' }}
          TIME_BUDGET_MIN: ${{ inputs.time_budget_min || '240' }}
          PARALLEL_LEAGUES: ${{ inputs.parallel_leagues || '1' }}
          LAST_N_SEASONS: ${{ inputs.last_n_seasons || '20' }}
        run: |
          python cloud_retrain_shard.py \
            --shard-index "$SHARD_INDEX" \
            --total-shards "$TOTAL_SHARDS" \
            --use-planner "$USE_PLANNER" \
            --leagues "$LEAGUES_INPUT" \
            --time-budget-min "$TIME_BUDGET_MIN" \
            --parallel-leagues "$PARALLEL_LEAGUES" \
            --last-n-seasons "$LAST_N_SEASONS"

      - name: Upload retrain log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-log-shard-${{ matrix.shard }}
          path: retrain_log_*.txt
          if-no-files-found: ignore
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # AUTO-CHAIN: smaltisce TUTTE le leghe del giorno, anche oltre il time-budget.
  # Quando il train job finisce (avendo allenato quante leghe stavano nelle 4h),
  # questo job rigira il planner: se restano ancora leghe con >=1 giornata nuova,
  # RILANCIA il workflow (workflow_dispatch via GITHUB_TOKEN). La concurrency
  # 'retrain-models' serializza => il nuovo run parte appena questo finisce: 5
  # shard -> 4h -> stop (finendo le leghe in corso) -> riparte, finche' la coda
  # del giorno e' vuota. Poi ogni giorno il backfill riavvia il ciclo.
  #
  # TERMINAZIONE: si ferma quando il planner ritorna 0 da fare (tutto addestrato).
  # FRENO ANTI-LOOP: MAX_CHAIN giri/giorno. Se dopo MAX_CHAIN restano ancora leghe
  # sono probabilmente "stuck" (il training non produce modello => trained_at non
  # avanza => restano selezionate): le logghiamo e ci fermiamo (riprese domani).
  # Cosi' una lega rotta non puo' far girare la catena — e bruciare runner — all'infinito.
  rechain:
    needs: [plan, train]
    # Solo se abbiamo davvero allenato qualcosa (train NON skippato). always() per
    # rilanciare anche se qualche shard e' fallito: le altre leghe vanno avanti.
    if: ${{ always() && needs.plan.outputs.has_work == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write      # necessario a `gh workflow run` per rilanciare
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-planner.txt

      - name: Install planner deps (leggere, niente training stack)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-planner.txt

      - name: Rilancia se restano leghe del giorno (auto-chain)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RETRAIN_INCREMENTAL_MIN_NEW: "10"
          CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: |
          MAX_CHAIN=8
          python - <<'PY'
          from training_planner import select_leagues_to_train
          p = select_leagues_to_train()
          todo = p["todo"]
          print(f"[RECHAIN] mode={p['mode']} | restano={len(todo)} -> {todo[:50]}")
          with open("remaining_count.txt", "w") as f:
              f.write(str(len(todo)))
          PY
          REMAINING=$(cat remaining_count.txt)
          echo "[RECHAIN] leghe rimaste=$REMAINING | chain_depth=$CHAIN_DEPTH | max=$MAX_CHAIN"
          if [ "$REMAINING" -eq 0 ]; then
            echo "[RECHAIN] OK: tutte le leghe del giorno sono addestrate. Stop."
            exit 0
          fi
          NEXT=$((CHAIN_DEPTH + 1))
          if [ "$NEXT" -ge "$MAX_CHAIN" ]; then
            echo "[RECHAIN] ATTENZIONE: raggiunto il cap di $MAX_CHAIN giri ma restano $REMAINING leghe (probabili 'stuck')."
            echo "[RECHAIN] Mi fermo: verranno riprese al prossimo backfill. Se sono sempre le stesse, valuta la blacklist."
            exit 0
          fi
          echo "[RECHAIN] Restano $REMAINING leghe: rilancio il workflow (giro $NEXT/$MAX_CHAIN)."
          gh workflow run retrain_models.yml -f chain_depth="$NEXT"
