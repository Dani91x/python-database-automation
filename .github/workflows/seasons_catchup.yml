name: Seasons Catchup (buchi di dati)
# 25/09/2026 - Recupero giornaliero dei buchi (seasons_catchup.py): partite FT senza
# eventi/formazioni/statistiche/quote, solo endpoint con flag di coverage True, dentro la
# quota API (riserva per le action giornaliere), stop a fine partita / lega-stagione.
#
# Catena: Daily Yesterday Backfill -> Leagues Mapping (giornaliero) (ora anche giornaliero,
# aggiorna i flag) -> QUESTO. Non gira mai insieme a Daily/Today/Results/Retrain (quota e DB,
# stesso DB): oltre all'aggancio dopo il mapper, lo script chiede a GitHub prima di ogni
# lega-stagione (e ogni 2 min durante) se una di quelle action e' in corso o in coda e,
# se si', si ferma a fine partita (exit 0, dichiarato). Il cron di GitHub parte con ~5 h
# di ritardo mediano (AUDIT_2026-09-25/ACTIONS_DIAGNOSI_E_FIX.md par. 5.3): il cron sotto
# (13:47 UTC, reale ~18:45 UTC) e' la seconda finestra del giorno, dopo Today/Results, e la
# rete di sicurezza se il workflow_run si perde. Con la quota gia' consumata non fa nulla.
#
# Exit (regola del 04/10): 0 lavoro fatto o fermato per quota/tempo/action concorrente, e anche
# buchi vecchi dovuti SOLO a API vuota / attesa del 2o tentativo / flag coverage False: NON sono
# un guasto, vengono dichiarati come AVVISO (log + riepilogo del job, titolo "BUCHI CHE L'API
# NON RIEMPIE"); 1 solo per guasti veri: lega-stagione in errore, buco aperto >
# BACKFILL_BUCHI_MAX_GIORNI per errore API ripetuto (o partite non tentate/aggregati da fare),
# degradata 57014 persistente; 2 pre-controlli (migrazione season_gaps_2026-09-25.sql non
# applicata, contatore quota non leggibile).
# Rete/gateway (regola dell'08/10, AUDIT_2026-10-08/action_catchup/REFERTO.md): HTTP 5xx/520 con
# pagina HTML di Cloudflare, connessione HTTP/2 chiusa dal server (GOAWAY a 10.000 richieste) e
# timeout di rete si RITENTANO (db_client.esegui_con_retry: 1 + 5 tentativi, ~62 s; client
# rinnovato ogni CATCHUP_RINNOVO_CLIENT_OGNI richieste). Guasto che resta: lega-stagione RINVIATA,
# dichiarata nel log e nel riepilogo del job ("RINVIATE PER GATEWAY/RETE"), exit 0; exit 1 solo
# oltre CATCHUP_SOGLIA_RINVII_RETE_PCT delle lega-stagioni considerate, per una lega-stagione
# rinviata da piu' di BACKFILL_BUCHI_MAX_GIORNI giorni consecutivi, o se il guasto blocca la run
# intera. Mai piu' un traceback per un guasto di rete.
#
# 09/10/2026 (cantiere orologio notturno): tolti l'aggancio workflow_run al mapper e il
# cron delle 13:47 UTC (seconda finestra del giorno). SETTIMO anello della catena
# notturna: lo lancia Leagues Mapping (passa-testimone). Nessuna finestra di giorno
# (decisione dell'utente del 09/10: di giorno l'app e' accesa). Riserva di quota API: ora
# Daily e Today Predictions girano PRIMA (le loro chiamate sono gia' nel contatore) e
# Predictions Results DOPO: nella catena CATCHUP_RISERVA_PER tiene la quota SOLO per
# Results (seasons_catchup.riserva_da_catena); lanciato a mano (catena=false) la variabile
# e' vuota e la riserva e' PIENA (prudente).

on:
  # Catena notturna IN FILA (un solo lavoro per volta sul DB), ordine del 09/10/2026:
  # 1 Daily Yesterday Backfill -> 2 Retrain ML -> 3 ML Post-Calibration ->
  # 4 Today Predictions Backfill -> 5 Hazard Atlas -> 6 Leagues Mapping ->
  # 7 Seasons Catchup -> 8 Predictions Results Backfill -> 9 Weekly Poisson (solo lunedi').
  # Il primo anello lo lancia l'orologio pg_cron (00:12 UTC); ogni anello lancia il
  # successivo con il job passa-testimone (in fondo al file). Nessun cron GitHub.
  workflow_dispatch:
    inputs:
      catena:
        description: "Catena notturna: 'true' = finito questo, lancia il prossimo anello (lo mettono l'orologio pg_cron e l'anello precedente). A mano lascia 'false': gira solo questo workflow."
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: seasons-catchup
  cancel-in-progress: false

permissions:
  contents: read
  actions: read        # per leggere lo stato delle action concorrenti

jobs:
  catchup:
    # Mai dopo un annullamento a monte: dal 09/10/2026 lo garantisce la staffetta.
    runs-on: ubuntu-latest
    # CATCHUP_MAX_MINUTI=150 (nessuna lega-stagione nuova dopo 150 min) + l'ultima in corso
    # si ferma a fine partita entro ~2 min + referto: 180 min di tetto.
    # R-CATCHUP-1 (26/09): + fino a 90 min di ATTESA iniziale che finiscano le action concorrenti
    # (il Retrain parte con lo stesso Daily e dura ~55 min): 270 min di tetto.
    timeout-minutes: 270
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run seasons catchup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_FOOTBALL_RISERVA_GIORNALIERA: '3000'
          # 09/10/2026: riserva = residua + la parte delle action elencate in CATCHUP_RISERVA_PER
          # (ognuna ceil(piena/3) = 1000, o `file.yml=N`), mai sopra la piena; dalle 23 UTC niente
          # lavoro nuovo
          API_FOOTBALL_RISERVA_RESIDUA: '300'
          # action che devono ANCORA girare oggi dopo il catchup: solo nella catena (catena=true)
          # Predictions Results; a mano vuota = riserva piena
          CATCHUP_RISERVA_PER: ${{ inputs.catena == 'true' && 'predictions_results_backfill.yml' || '' }}
          CATCHUP_ORA_STOP_UTC: '23'
          CATCHUP_MAX_MINUTI: '150'
          # R-CATCHUP-1 (26/09): prima di iniziare aspetta (ricontrollo ogni 2 min, al massimo 90 min)
          # che Daily/Today/Results/Retrain non siano in corso/in coda, invece di fermarsi alla prima lega
          CATCHUP_ATTESA_CONCORRENTI_MAX_MINUTI: '90'
          # 400 stagioni passate verificate per notte (erano 150): +13 RPC season_gaps_summary (blocchi
          # da 20), +2 season_aggregates_summary, +250 righe di stato; 5.796 stagioni v1 in ~15 notti
          CATCHUP_MAX_VERIFICHE_PASSATE: '400'
          BACKFILL_BUCHI_MAX_GIORNI: '3'
          # P4 stagioni mai caricate (dopo P1-P3): margine minimo lasciato intatto; '1' per includere
          # anche le stagioni senza fixtures_events (API senza eventi)
          CATCHUP_P4_MARGINE_MINIMO: '500'
          CATCHUP_P4_ANCHE_SENZA_EVENTI: '0'
          # stagioni 'current' con fine passata da > 30 gg: /leagues mirata (1 chiamata, 1 volta/settimana)
          CATCHUP_MAX_VERIFICHE_CURRENT: '100'
          # 08/10: client PostgREST nuovo ogni 5.000 richieste (il server chiude la connessione a 10.000)
          CATCHUP_RINNOVO_CLIENT_OGNI: '5000'
          # 08/10: rinvii per guasto di rete/gateway oltre questa % delle lega-stagioni considerate -> exit 1
          CATCHUP_SOGLIA_RINVII_RETE_PCT: '50'
          # 08/10: stampe e log nell'ordine vero (prima i print del referto uscivano tutti in fondo)
          PYTHONUNBUFFERED: '1'
        run: python seasons_catchup.py

  # STAFFETTA (09/10/2026, cantiere orologio notturno): finito il lavoro di questa run,
  # lancia il PROSSIMO anello della catena notturna (workflow_dispatch con GITHUB_TOKEN,
  # .github/scripts/passa_testimone.sh). Regola: passa il testimone se la run NON e' stata
  # annullata (!cancelled(): anche dopo un fallimento la catena prosegue, una cancellazione
  # manuale la ferma) e SOLO se questa run fa parte della catena (input catena=true: lo
  # mettono l'orologio pg_cron e l'anello precedente; un lancio a mano parte con
  # catena=false e NON trascina gli anelli a valle).
  passa-testimone:
    needs: [catchup]
    if: ${{ !cancelled() && inputs.catena == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: write      # gh workflow run del prossimo anello
      contents: read
    steps:
      - name: Checkout (solo lo script della staffetta)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Passa il testimone a predictions_results_backfill.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROSSIMO_ANELLO: predictions_results_backfill.yml
        run: bash .github/scripts/passa_testimone.sh "$PROSSIMO_ANELLO"
